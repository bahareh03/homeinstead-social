# ---- Daily social auto-post config: edit freely ----

business:
  name: "Home Instead Leeds Central"
  phone: "0113 518 3005"
  email: "central.leeds@homeinstead.co.uk"
  website_short: "homeinstead.co.uk/leedscentral"     # shown on images
  website: "https://www.homeinstead.co.uk/leedscentral"
  recruitment_url: "https://www.homeinstead.co.uk/leedscentral"   # change to your jobs/apply page
  area: "Leeds"
  timezone: "Europe/London"

# Where to publish (free, direct APIs). Remove one to stop posting there.
# Facebook & Instagram get the version with hashtags; Google gets a cleaner one.
platforms: [facebook, instagram, google]
# Platforms the Make.com scenario posts to (the rest use the direct APIs, if their keys are set)
make_platforms: [google, facebook, instagram]

# Approval: first N published posts need your OK (GitHub Issue), then fully automatic
mode: "auto"                 # posts publish automatically (approve_first | draft | auto)
approvals_required: 5

# ---- Weekly plan (Mon=0 ... Sun=6) ----
weekly_plan:
  0: difference       # home care & how we're different
  1: choice           # my pick (competitive topics)
  2: education        # condition older people face
  3: choice           # franchisor content slot (Thursdays, run-up to the weekend)
  4: live_in
  5: recruitment
  6: choice

# Franchisor monthly content: drop files into franchisor/YYYY-MM/
#   - the monthly plan .docx (Day / Content Idea / Copy table): posts are designed automatically
#   - or ready-made images: winter-wellbeing.jpg + winter-wellbeing.txt (caption)
franchisor:
  per_month: 3
  folder: "franchisor"

education_topics: [Alzheimer's disease, vascular dementia, early signs of dementia, Parkinson's disease,
  stroke recovery at home, falls prevention, arthritis, type 2 diabetes in later life, loneliness and isolation,
  sight loss, hearing loss, osteoporosis, COPD, urinary tract infections and confusion, malnutrition and dehydration,
  sundowning in dementia, delirium after hospital]

# "My pick" days: topics chosen to win against other Leeds home care companies
choice_topics: [
  "minimum one-hour visits: never rushed 15-minute calls",
  "matching each client with a consistent care professional",
  "home help after a hospital stay in Leeds",
  "respite to give family carers a proper break",
  "companionship and beating loneliness in Leeds",
  "our in-home nail care service",
  "chairobics and staying active at home",
  "dementia care that keeps people at home longer than a care home move",
  "how quickly we can start care after an enquiry",
  "how our care professionals are trained",
  "staying connected with the Leeds community: Age Friendly Leeds",
  "what to ask any home care provider before you choose",
  "home care vs care home: costs and benefits explained",
  "a day in the life of a Home Instead care professional"]

# Hashtags per post type, most important first. Instagram uses the first 5 (its maximum), Facebook the first 2.
hashtags:
  difference:  ["#HomeCareLeeds", "#HomeInstead", "#ElderlyCare", "#CareAtHome", "#Leeds"]
  education:   ["#HomeCareLeeds", "#FamilyCarers", "#HealthyAgeing", "#ElderlyCare", "#Leeds"]
  live_in:     ["#LiveInCare", "#HomeCareLeeds", "#ElderlyCare", "#CareAtHome", "#Leeds"]
  recruitment: ["#CareJobsLeeds", "#LeedsJobs", "#CareJobs", "#CareerInCare", "#HomeInstead"]
  choice:      ["#HomeCareLeeds", "#CompanionshipCare", "#ElderlyCare", "#HomeInstead", "#Leeds"]
  franchisor:  ["#HomeCareLeeds", "#HomeInstead", "#ElderlyCare", "#CareAtHome", "#Leeds"]
# National campaign hashtags by month (from the franchisor's monthly plan), added first
campaign_hashtags:
  "2026-10": ["#WeekendsWellSpent"]

topic_hashtags:          # added first on educational posts about these topics
  dementia: "#DementiaCare"
  alzheimer: "#Alzheimers"
  parkinson: "#Parkinsons"
  stroke: "#StrokeRecovery"
  loneliness: "#Loneliness"
  falls: "#FallsPrevention"

# Google posts should sell or convince; tips and job ads go to Facebook/Instagram only
google_post_types: [difference, live_in, choice, franchisor]

# Leeds areas we cover, mentioned one per post (natural local relevance)
areas: [Headingley, Chapel Allerton, Meanwood, Chapeltown, Kirkstall, Armley, Cross Gates, Moor Allerton,
        Bramley, Weetwood, Far Headingley, Harehills, Burley, Whitkirk, Hunslet]

# Keyword research (website + Leeds senior home care / domiciliary care companies, keywords only)
own_site:
  start_urls:
    - "https://www.homeinstead.co.uk/leedscentral"
    - "https://www.homeinstead.co.uk/leedscentral/local-home-care-services/home-care"
  allowed_prefix: "https://www.homeinstead.co.uk/leedscentral"
  max_pages: 40
competitors:
  - "https://homecare.co.uk/homecare/listings.cfm/searchtown/Leeds/hctype/elderly-care"
  - "https://www.careah.co.uk/domiciliary-care-agencies/leeds?page=1"
  - "https://www.caremark.co.uk/locations/leeds"
  - "https://www.aegiscaresolutions.co.uk"
  - "https://www.splendidcaresolutions.co.uk"
  # add more Leeds home care company websites here (any that fail to load are skipped)
keyword_refresh_days: 7
keywords_per_post: 3
# Phrases Leeds families actually search for. These are used first, rotated across posts
# (the weekly scrape only adds extra phrases that also appear on our own site).
priority_keywords:
  difference:  ["home care in Leeds", "domiciliary care in Leeds", "elderly care at home", "home care agency in Leeds"]
  choice:      ["companionship care", "respite care in Leeds", "home help for the elderly", "care after a hospital stay", "personal care at home"]
  live_in:     ["live-in care in Leeds", "24-hour care at home", "alternative to a care home"]
  education:   ["dementia care in Leeds", "Alzheimer's support at home", "elderly care at home"]
  recruitment: ["care jobs in Leeds", "carer jobs Leeds", "home care jobs"]
  franchisor:  ["home care in Leeds"]

seed_terms: [care, carer, dementia, alzheimer, companionship, respite, live-in, overnight,
             personal, elderly, senior, older, home, palliative, hospital, discharge,
             mobility, nail, meal, medication, visiting, domiciliary, support, independence]
