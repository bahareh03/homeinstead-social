name: Daily social post

on:
  schedule:
    # GitHub often starts scheduled runs late, so start early and wait until exactly 08:00 UK time
    # (works in both summer and winter time). The second start is a backup; the daily guard stops doubles.
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch: {}          # "Run workflow" button for a manual run
  issues:
    types: [labeled]             # approval: add the 'approved' label to publish

permissions:
  contents: write
  issues: write

concurrency: social-post         # never run two at once

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  IG_TOKEN: ${{ secrets.IG_TOKEN }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
  GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
  GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
  GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
  GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
  GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
  MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}

jobs:
  build:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null && pip install -r requirements.txt
      - run: git config user.name "post-bot" && git config user.email "bot@users.noreply.github.com"
      - name: Refresh keywords (weekly)
        run: |
          if [ -z "$(find state/keywords.json -mtime -7 2>/dev/null)" ]; then python scripts/keywords.py; fi
      - name: Only one post per day
        id: today
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && ls images/$(TZ=Europe/London date +%F)-*.jpg >/dev/null 2>&1; then
            echo "Already posted today, skipping"; echo "skip=1" >> $GITHUB_OUTPUT
          fi
      - run: python scripts/make_post.py
        if: steps.today.outputs.skip != '1'
      - name: Push image so it has a public link
        if: steps.today.outputs.skip != '1'
        run: |
          git add images state/keywords.json 2>/dev/null; git commit -m "Image for $(date +%F)" || true
          git push
      - name: Wait until 08:00 UK time
        if: steps.today.outputs.skip != '1' && github.event_name == 'schedule'
        run: |
          secs=$(( $(TZ=Europe/London date -d "08:00" +%s) - $(date +%s) ))
          if [ $secs -gt 0 ]; then echo "Waiting $secs seconds"; sleep $secs; fi
      - name: Ask for approval, or publish
        if: steps.today.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python scripts/decide.py)" = "draft" ]; then
            gh label create approved --color 0E8A16 2>/dev/null || true
            python scripts/issue_body.py > body.md
            gh issue create --title "Post for approval: $(date +%a\ %d\ %b)" --body-file body.md
          else
            python scripts/publish.py
          fi
      - name: Daily report (emailed by GitHub)
        if: always() && hashFiles('state/next_post.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state/publish_result.json ] || [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/report.py
            gh label create report --color 1D76DB 2>/dev/null || true
            gh issue create --title "$(cat state/report_title.txt)" --body-file state/report.md --label report
          fi
      - name: Save history
        if: always()
        run: |
          [ -f state/history.json ] && git add state/history.json; git commit -m "Update history" || true
          git push || true

  publish-approved:
    if: github.event_name == 'issues' && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Stop if this post was already published
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh issue view ${{ github.event.issue.number }} --json state --jq .state)" = "CLOSED" ]; then
            echo "Already published or skipped, nothing to do"; echo "stop=1" >> $GITHUB_OUTPUT
          fi
      - name: Extract approved post from issue
        if: steps.guard.outputs.stop != '1'
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p state
          python -c "import os,re;m=re.search(r'<!--POST\n(.*)\nPOST-->',os.environ['BODY'],re.S);open('state/next_post.json','w').write(m.group(1))"
      - run: python scripts/publish.py
        if: steps.guard.outputs.stop != '1'
      - name: Daily report (emailed by GitHub)
        if: always() && steps.guard.outputs.stop != '1' && hashFiles('state/next_post.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state/publish_result.json ] || [ "${{ github.event_name }}" = "issues" ]; then
            python scripts/report.py
            gh label create report --color 1D76DB 2>/dev/null || true
            gh issue create --title "$(cat state/report_title.txt)" --body-file state/report.md --label report
          fi
      - name: Save history and close issue
        if: success() && steps.guard.outputs.stop != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "post-bot"; git config user.email "bot@users.noreply.github.com"
          git add state/history.json && git commit -m "Record published post" || true
          git push
          gh issue close ${{ github.event.issue.number }} --comment "Published ✅ (see the daily report issue)"
